name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build web
        run: |
          npm install
          npm uninstall firebase-admin || true
          npx vite build

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH
          export PATH="/opt/gradle-8.2/bin:$PATH"

      - name: Create Android WebView app
        run: |
          rm -rf android
          mkdir -p android/app/src/main/java/com/laporankuyoks/app
          mkdir -p android/app/src/main/res/values

          cat > android/build.gradle << 'GEOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GEOF

          cat > android/settings.gradle << 'SEOF'
          rootProject.name = 'LaporanPintarID'
          include ':app'
          SEOF

          cat > android/gradle.properties << 'PEOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          PEOF

          cat > android/app/build.gradle << 'AEOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.laporankuyoks.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.laporankuyoks.app"
              minSdk 22
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          AEOF

          cat > android/app/src/main/AndroidManifest.xml << 'MEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <application android:allowBackup="true" android:usesCleartextTraffic="true" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MEOF

          cat > android/app/src/main/java/com/laporankuyoks/app/MainActivity.java << 'JEOF'
          package com.laporankuyoks.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.graphics.Color;

          public class MainActivity extends Activity {
            private WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setStatusBarColor(Color.BLACK);
              getWindow().setNavigationBarColor(Color.BLACK);
              webView = new WebView(this);
              setContentView(webView);
              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              ws.setMediaPlaybackRequiresUserGesture(false);
              ws.setCacheMode(WebSettings.LOAD_DEFAULT);
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("https://laporankuyoks.freebuff.app");
            }
            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          JEOF

          cat > android/app/src/main/res/values/styles.xml << 'SEOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
              <item name="android:statusBarColor">#FF000000</item>
              <item name="android:navigationBarColor">#FF000000</item>
            </style>
          </resources>
          SEOF2

          cd android && gradle wrapper --gradle-version 8.2 && cd ..

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
