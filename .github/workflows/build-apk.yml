name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web
        run: |
          npm install
          npm uninstall firebase-admin || true
          npx vite build

      - name: Download Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Create Android project
        run: |
          rm -rf android
          mkdir -p android/app/src/main/java/com/laporankuyoks/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets

          # Copy web build to assets
          cp -r dist/* android/app/src/main/assets/

          cat > android/build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > android/settings.gradle << 'EOF'
          rootProject.name = 'LaporanPintarID'
          include ':app'
          EOF

          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.laporankuyoks.app'
            compileSdk 34
            defaultConfig {
              applicationId "com.laporankuyoks.app"
              minSdk 22
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.RECORD_AUDIO"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:allowBackup="true" android:usesCleartextTraffic="true" android:theme="@style/AppTheme"
              android:name=".LaporanApp">
              <activity android:name=".MainActivity" android:exported="true"
                android:configChanges="orientation|screenSize|keyboard|keyboardHidden"
                android:launchMode="singleTask">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/laporankuyoks/app/LaporanApp.java << 'EOF'
          package com.laporankuyoks.app;
          import android.app.Application;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.os.Build;

          public class LaporanApp extends Application {
            public static final String CHANNEL_ID = "laporan_notifications";
            @Override
            public void onCreate() {
              super.onCreate();
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                NotificationChannel channel = new NotificationChannel(
                  CHANNEL_ID, "Notifikasi Laporan", NotificationManager.IMPORTANCE_HIGH);
                channel.setDescription("Notifikasi dari Laporan Pintar");
                NotificationManager nm = getSystemService(NotificationManager.class);
                nm.createNotificationChannel(channel);
              }
            }
          }
          EOF

          cat > android/app/src/main/java/com/laporankuyoks/app/MainActivity.java << 'EOF'
          package com.laporankuyoks.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.graphics.Color;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.os.Build;

          public class MainActivity extends Activity {
            private WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              Window w = getWindow();
              w.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
              w.setStatusBarColor(Color.BLACK);
              w.setNavigationBarColor(Color.BLACK);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                w.getAttributes().layoutInDisplayCutoutMode =
                  WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
              }
              webView = new WebView(this);
              setContentView(webView);
              webView.setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              ws.setDatabaseEnabled(true);
              ws.setMediaPlaybackRequiresUserGesture(false);
              ws.setAllowFileAccess(true);
              ws.setAllowContentAccess(true);
              ws.setCacheMode(WebSettings.LOAD_DEFAULT);
              ws.setLoadWithOverviewMode(true);
              ws.setUseWideViewPort(true);
              webView.setWebViewClient(new WebViewClient() {
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                  view.loadUrl(req.getUrl().toString());
                  return true;
                }
              });
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("https://laporankuyoks.freebuff.app");
            }
            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          EOF

          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
              <item name="android:statusBarColor">#FF000000</item>
              <item name="android:navigationBarColor">#FF000000</item>
              <item name="android:windowFullscreen">false</item>
            </style>
          </resources>
          EOF

          cd android && gradle wrapper --gradle-version 8.2 && cd ..

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LaporanPintarID-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
